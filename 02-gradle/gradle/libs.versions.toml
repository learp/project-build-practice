# Version Catalog — все версии проекта в одном месте (аналог <properties> в pom.xml).
# В build.gradle остаются только алиасы: libs.gson, libs.lombok, ...
# Синтаксис: https://docs.gradle.org/current/userguide/version_catalogs.html

[versions]
gson = "2.9.0"
converter-gson = "2.11.0"
slf4j = "2.0.9"
logback = "1.4.14"
lombok = "1.18.48"
junit = "5.10.2"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converter-gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
