# CI-конвейер log-stats — GitHub Actions.
# Собирается на каждый пуш и PR, matrix на две Java, кэш Gradle, артефакт — jar, образ — в ghcr.

name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21, 25] # всё, что проект обещает поддерживать (README 02-gradle: JDK 21+)
    defaults:
      run:
        working-directory: 02-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Ручной кэш вместо gradle/actions/setup-gradle — ради прозрачности:
      # первый прогон честный miss, второй — hit, разница видна в UI.
      # wrapper — главный выигрыш: дистрибутив Gradle (~130 МБ) не качается заново.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java${{ matrix.java }}-${{ hashFiles('02-gradle/gradle/libs.versions.toml') }}

      # --no-daemon: раннер одноразовый, демон не переживёт джобу (тема слайда «Сборка Java в CI»)
      - run: ./gradlew --no-daemon build

      # ВАЖНО: путь от корня workspace — upload-artifact НЕ уважает working-directory.
      # Имя должно быть уникальным для каждой ноги matrix (v4 запрещает дубликаты).
      - uses: actions/upload-artifact@v4
        with:
          name: logstats-java${{ matrix.java }}
          path: 02-gradle/build/libs/logstats-1.0.0.jar

  docker:
    needs: build
    runs-on: ubuntu-latest
    # Без packages: write пуш в ghcr упадёт красным — дефолтных прав токена мало.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # push из постоянных веток: main/master — раскатка арки на лекции; solution —
      # чтобы пакет в ghcr создался при подготовке (первый пакет приватный —
      # включить public visibility в настройках). PR (в т.ч. из форков) не пушат.
      # context: 02-gradle — иначе в образ уедет весь монорепо.
      - uses: docker/build-push-action@v6
        with:
          context: 02-gradle
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/solution' }}
          tags: ghcr.io/learp/log-stats:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
